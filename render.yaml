services:
  - type: web
    name: iam-danii-vip-plus18
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: IAM_Danii_VIP_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SIGNING_SECRET
        generateValue: true
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
