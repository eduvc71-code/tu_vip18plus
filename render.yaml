services:
  - type: web
    name: flavia-ruti-vip-plus18
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: vip_ruti_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_SIGNING_SECRET
        generateValue: true
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
