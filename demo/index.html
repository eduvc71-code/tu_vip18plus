<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tú VIP Demo" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Tú VIP FREE • Demo & Simulador Comercial</title>
    <!-- Google Fonts: Inter (sans) + Playfair Display (serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Estilos de la Portada de Carga Inicial (visible hasta que React monta) -->
    <style>
      html, body { background-color: #09090b; }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #09090b;
        color: #f4f4f5;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }
      #initial-splash .splash-card { max-width: 26rem; width: 100%; display: flex; flex-direction: column; gap: 14px; }
      #initial-splash .splash-badge {
        width: 56px; height: 56px; margin: 0 auto;
        border-radius: 18px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, rgba(245,158,11,0.25), rgba(245,158,11,0.08));
        border: 1px solid rgba(245,158,11,0.4);
        color: #fbbf24; font-weight: 900; font-size: 18px;
      }
      #initial-splash h1 { font-size: 20px; font-weight: 800; color: #fff; margin: 0; line-height: 1.3; }
      #initial-splash p.sub { font-size: 12px; color: #a1a1aa; margin: 0; line-height: 1.6; }
      #initial-splash .splash-bar { width: 100%; height: 6px; background: #27272a; border-radius: 9999px; overflow: hidden; margin-top: 6px; }
      #initial-splash .splash-bar > span {
        display: block; height: 100%; width: 40%; border-radius: 9999px;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        animation: splashBarra 1.4s ease-in-out infinite;
      }
      @keyframes splashBarra {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <!-- Portada de Carga Inicial (estática). React la reemplaza al montar. -->
      <div id="initial-splash">
        <div class="splash-card">
          <div class="splash-badge">VIP</div>
          <h1>Demostración Interactiva</h1>
          <p class="sub">Plataforma 100% Personalizable y Adaptable a tu Medida. Cargando la demostración...</p>
          <div class="splash-bar"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
